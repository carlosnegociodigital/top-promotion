E acrescente este pequeno ajuste no CSS, para o link ocupar **100% do banner** e não alterar o tamanho ou a aparência dele:

```css
.slide a {
    display: block;
    width: 100%;
    height: 100%;
}

.slide a img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
}
```
